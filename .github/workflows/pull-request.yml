name: PR Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on: pull_request

jobs:
  call_workflow:
    name: Run PR Build Workflow
    if: ${{ github.repository_owner == 'CharanaManawathilake' }}
    uses: CharanaManawathilake/ballerina-library/.github/workflows/pull-request-build-template.yml@use-scan-ballerina-action
    secrets: inherit
    with:
      additional-windows-test-flags: -x test
